<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change details — Web Page Change Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
      color: #F3F4F6;
      background: #09090E;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .meta { color: #9CA3AF; font-size: 12px; margin-bottom: 12px; }
    a { color: #A78BFA; }
    .diff {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 13px;
      background: #18181F;
      border: 1px solid #2B2B36;
      border-radius: 8px;
      padding: 14px;
      word-break: break-word;
    }
    ins {
      background: rgba(34, 197, 94, 0.22);
      text-decoration: none;
      border-radius: 3px;
      padding: 0 2px;
    }
    del {
      background: rgba(248, 113, 113, 0.22);
      border-radius: 3px;
      padding: 0 2px;
    }
    .empty { color: #9CA3AF; font-style: italic; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <p><a id="open" href="#" target="_blank" rel="noopener">Open page ↗</a></p>
  <div class="diff" id="diff"></div>
  <script src="diff.js"></script>
</body>
</html>
