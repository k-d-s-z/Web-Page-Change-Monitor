<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change details &#x2014; Web Page Change Monitor</title>
  <!-- Audyt: wspolna paleta (theme.css) + wspolny slownik (i18n.js), zeby
       motywy i jezyk nie rozjezdzaly sie z popupem. -->
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Tylko zmienne specyficzne dla widoku diff; kolory marki/statusow
       i motyw (dark/light) zyja w theme.css (audyt). --accent to celowy
       alias na zmienne marki z theme.css. */
    :root {
      --panel: #121318;
      --panel-2: #18181F;
      --panel-3: #1F1F28;
      --muted: var(--text-2);
      --accent: var(--brand-soft);
      --accent-strong: var(--brand);
      --success-bg: rgba(34, 197, 94, 0.18);
      --danger-bg: rgba(248, 113, 113, 0.18);
      --removed-bg: rgba(248, 113, 113, 0.12);
      --added-bg: rgba(34, 197, 94, 0.12);
      --shadow: rgba(0, 0, 0, 0.26);
    }

    /* Light mode: palette override + a few rgba overlays that assumed dark bg. */
    [data-theme="light"] {
      --panel: #FFFFFF;
      --panel-2: #F2F4F6;
      --panel-3: #ECEFF2;
      --success-bg: rgba(5, 150, 105, 0.14);
      --danger-bg: rgba(220, 38, 38, 0.14);
      --removed-bg: rgba(220, 38, 38, 0.10);
      --added-bg: rgba(5, 150, 105, 0.10);
      --shadow: rgba(15, 23, 42, 0.12);
    }
    [data-theme="light"] .stat-add { color: #047857; }
    [data-theme="light"] .stat-del { color: #DC2626; }
    [data-theme="light"] .diff-line.equivalent { color: rgba(31, 35, 40, 0.72); }
    [data-theme="light"] .diff-line.changed { background: rgba(0, 0, 0, 0.03); }
    [data-theme="light"] .diff-skip { background: rgba(0, 0, 0, 0.04); }
    [data-theme="light"] .diff-line.changed ins,
    [data-theme="light"] .diff-line.changed del { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.10); }
    /* Default ins/del/h1 colors are pale (made for the dark theme) and vanish
       on a light background - give them dark, readable colors in light mode. */
    [data-theme="light"] ins { color: #065F46; }
    [data-theme="light"] del { color: #991B1B; }
    [data-theme="light"] h1 { color: var(--text); }
    [data-theme="light"] .diff {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.015), rgba(0, 0, 0, 0));
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(139, 92, 246, 0.08), transparent 30%),
        var(--bg);
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.5;
      word-break: break-word;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats {
      display: inline-flex;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .stat-add {
      color: #22C55E;
    }

    .stat-del {
      color: #F87171;
    }

    .only-changes {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .only-changes input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .diff-skip {
      display: block;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      margin: 3px -4px;
      font-size: 12px;
      font-style: italic;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .diff-skip:hover,
    .diff-skip:focus-visible {
      color: var(--text);
      border-color: var(--accent);
      outline: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    a:focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }

    .diff {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0));
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px var(--shadow);
      padding: 14px 14px 10px;
      min-height: 180px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .diff-line {
      display: block;
      padding: 3px 8px 3px 10px;
      margin: 0 -8px;
      border-radius: 6px;
      color: var(--text);
      min-height: 1.7em;
    }

    .diff-line.equivalent {
      color: rgba(243, 244, 246, 0.85);
    }

    .diff-line.changed {
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid rgba(167, 139, 250, 0.7);
    }

    .diff-line.added {
      background: var(--added-bg);
      border-left: 3px solid rgba(34, 197, 94, 0.9);
    }

    .diff-line.removed {
      background: var(--removed-bg);
      border-left: 3px solid rgba(248, 113, 113, 0.9);
    }

    .diff-line.empty {
      color: transparent;
      background: transparent;
      border-left-color: transparent;
    }

    ins, del {
      display: inline;
      text-decoration: none;
      border-radius: 4px;
      padding: 0 2px;
    }

    /* Audyt: ramka wokol tekstu (box-shadow) tylko w liniach ze zmiana
       slowa, gdzie wskazuje, CO sie zmienilo; w calych dodanych/usunietych
       liniach byla szumem na tle kolorowej linii. */
    .diff-line.changed ins,
    .diff-line.changed del {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    ins {
      background: var(--success-bg);
      color: #DCFCE7;
    }

    del {
      background: var(--danger-bg);
      color: #FECACA;
    }

    .empty {
      display: inline-block;
      color: var(--muted);
      font-style: italic;
      line-height: 1.7;
      padding: 8px 6px;
    }

    @media (max-width: 640px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .toolbar {
        width: 100%;
      }

      .diff {
        font-size: 14px;
        padding: 12px 10px 8px;
      }

      .diff-line {
        margin: 0 -4px;
        padding-left: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="toolbar">
        <span class="stats" id="stats"></span>
        <label class="only-changes"><input type="checkbox" id="only-changes"><span id="only-changes-label"></span></label>
        <a id="open" href="#" target="_blank" rel="noopener"><span id="open-label">Open page</span> &#x2197;</a>
      </div>
    </div>

    <div class="diff" id="diff"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="diff.js"></script>
</body>
</html>
