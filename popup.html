<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html {
      overflow-x: hidden;
    }
    body {
      width: 540px;
      margin: 0;
      padding: 12px;
      background-color: #09090E;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .counter-badge {
      font-size: 12px;
      color: #A78BFA;
      font-weight: 600;
      margin-left: 4px;
    }
    #form-title {
      margin-bottom: 12px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      box-sizing: border-box;
      background: #18181F;
      border: 1px solid #2B2B36;
      color: #9CA3AF;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }
    .icon-btn svg {
      display: block;
      pointer-events: none;
    }
    .icon-btn:hover {
      color: #FFFFFF;
      background: #23232F;
      border-color: #3B3B4A;
    }
    .icon-btn:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .icon-btn.primary {
      background: #7C3AED;
      border-color: #7C3AED;
      color: #FFFFFF;
    }
    .icon-btn.primary:hover {
      background: #8B5CF6;
      border-color: #8B5CF6;
    }
    .icon-btn.busy svg {
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Panel ustawie&#x144;: wysuwanie przez grid-rows 0fr -> 1fr (p&#x142;ynne,
       bez znanej pulapki animowania max-height). */
    .settings-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-bottom: 0;
      transition: grid-template-rows 0.25s ease, opacity 0.25s ease, margin-bottom 0.25s ease;
    }
    .settings-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-bottom: 12px;
    }
    .settings-panel-inner {
      overflow: hidden;
      min-height: 0;
    }
    .settings-box {
      background: #18181F;
      border: 1px solid #2B2B36;
      border-radius: 12px;
      padding: 10px 12px 12px;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #F5F5F5;
      font-size: 13px;
      font-weight: 700;
    }
    .settings-header .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
    }
    /* Uk&#x142;ad 2&#xd7;2: kolumna &#x201e;Kopia ustawie&#x144;" (Utw&#xf3;rz/Przywr&#xf3;&#x107;) i kolumna
       &#x201e;J&#x119;zyk" (EN/PL) &#x2014; r&#xf3;wne kolumny z kr&#xf3;tkimi nag&#x142;&#xf3;wkami. */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .settings-col-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9CA3AF;
      margin-bottom: 6px;
      text-align: center;
    }
    .settings-col-actions {
      display: flex;
      gap: 6px;
    }
    .settings-col-actions > button {
      flex: 1;
      min-width: 0;
    }
    .lang-switcher {
      display: flex;
      gap: 4px;
      background: #121218;
      border: 1px solid #23232F;
      padding: 2px;
      border-radius: 10px;
      box-sizing: border-box;
      width: 100%;
    }
    .lang-switcher .lang-btn {
      flex: 1;
    }
    .lang-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #9CA3AF;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      color: #FFFFFF;
    }
    .lang-btn.active {
      background: #7C3AED;
      color: #FFFFFF;
    }
    .btn-secondary {
      flex: 1;
      padding: 6px 8px;
      background: #18181F;
      border: 1px solid #2B2B36;
      color: #E5E7EB;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .btn-secondary:hover {
      color: #FFFFFF;
      background: #23232F;
      border-color: #3B3B4A;
    }
    .btn-secondary:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .btn-main {
      width: 100%;
      padding: 9px 10px;
      background: #7C3AED;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .btn-main:hover {
      background: #8B5CF6;
    }
    .btn-main:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-main:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 2px;
    }
    .btn-cancel {
      background: #18181F;
      color: #9CA3AF;
      border: 1px solid #2B2B36;
    }
    .btn-cancel:hover {
      background: #23232F;
      color: #FFFFFF;
    }
    .list-footer {
      position: sticky;
      bottom: 0;
      z-index: 3;
      margin: 8px -12px -12px;
      padding: 8px 12px 12px;
      background: rgba(9, 9, 14, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .refresh-summary {
      font-size: 12px;
      color: #9CA3AF;
      margin-bottom: 6px;
      min-height: 15px;
    }
    .refresh-summary:empty {
      display: none;
    }
    .refresh-summary.ok {
      color: #A78BFA;
    }
    .refresh-summary.warn {
      color: #FBBF24;
    }
    .site-card {
      background: #18181F;
      border: 1px solid #2B2B36;
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 60px;
      box-sizing: border-box;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.2s ease;
    }
    .site-card:hover {
      border-color: #3B3B4A;
      background: #1F1F28;
    }
    .site-card:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    /* A2: pauza &#x2014; karta w pe&#x142;ni czytelna (bez opacity na ca&#x142;o&#x15b;ci);
       wyciszamy tylko nazw&#x119; i metadane oraz ramk&#x119;. Dzia&#x142;a te&#x17c; z hover. */
    .site-card.paused {
      border-style: dashed;
      border-color: #23232F;
    }
    .site-card.paused .site-name {
      color: #9CA3AF;
    }
    .site-card.paused .site-meta {
      color: #6B7280;
    }
    .site-card.paused:hover {
      border-color: #3B3B4A;
      background: #1F1F28;
    }
    .site-card.paused:hover .site-name {
      color: #D1D5DB;
    }
    .site-card.paused:hover .site-meta {
      color: #9CA3AF;
    }
    .site-card.dragging {
      opacity: 1;
      border-color: #8B5CF6;
      transform: scale(1.01);
      position: relative;
      z-index: 2;
      background: #23232F;
    }
    body.is-dragging,
    body.is-dragging * {
      cursor: grabbing !important;
    }
    .site-card.confirming {
      border-color: #8B5CF6;
      background: #1F1F28;
    }
    .drag-handle {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 36px;
      margin: -2px 0 -2px -4px;
      padding: 0;
      background: #23232F;
      border: 1px solid #2B2B36;
      border-radius: 6px;
      color: #9CA3AF;
      cursor: grab;
      touch-action: none;
      transition: all 0.2s ease;
    }
    .drag-handle:hover {
      color: #FFFFFF;
      background: #2B2B36;
    }
    .drag-handle:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
      color: #FFFFFF;
    }
    .drag-handle svg {
      pointer-events: none;
      width: 10px;
      height: 10px;
    }
    .site-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .site-info:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 2px;
      border-radius: 6px;
    }
    .site-name {
      font-weight: 700;
      font-size: 14px;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .site-favicon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      vertical-align: -3px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .site-meta {
      font-size: 12px;
      color: #C7CED6;
      margin-top: 3px;
      line-height: 1.45;
    }
    .icon-inline {
      vertical-align: -1px;
    }
    .meta-error {
      color: #F87171;
      text-decoration: underline;
      cursor: help;
    }
    .meta-flash.ok {
      color: #A78BFA;
    }
    .meta-flash.warn {
      color: #FBBF24;
    }
    .link-diff {
      color: #A78BFA;
      font-weight: 600;
      cursor: pointer;
    }
    .link-diff:hover {
      color: #C4B5FD;
      text-decoration: underline;
    }
    .link-diff:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      box-sizing: border-box;
      background: #23232F;
      border: 1px solid #2B2B36;
      color: #9CA3AF;
      border-radius: 8px;
      padding: 0 8px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .btn-icon svg {
      display: block;
      pointer-events: none;
    }
    .btn-icon .icon {
      display: inline-flex;
    }
    .btn-icon:hover {
      color: #FFFFFF;
      border-color: #3B3B4A;
      background: #2B2B36;
    }
    .btn-icon:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .btn-icon:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .btn-refresh.spinning .icon {
      animation: spin 0.9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-refresh.spinning .icon,
      .icon-btn.busy svg { animation-duration: 3s; }
      .settings-panel { transition: none; }
      .settings-panel:not(.open) { display: none; }
    }
    .btn-toggle {
      color: #9CA3AF;
    }
    .btn-delete:hover {
      color: #F87171;
      border-color: rgba(248, 113, 113, 0.4);
      background: #2B2B36;
    }
    .confirm-text {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 500;
      color: #F3F4F6;
    }
    .confirm-name {
      font-size: 11px;
      font-weight: normal;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-confirm-yes, .btn-confirm-no {
      padding: 0 14px;
      font-weight: 700;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn-confirm-yes {
      background: #7C3AED;
      border: none;
      color: #FFFFFF;
    }
    .btn-confirm-yes:hover {
      background: #8B5CF6;
    }
    .hint, .field-hint {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 3px;
      line-height: 1.45;
    }
    .hint { text-align: center; }
    .badge-changed {
      background: #7C3AED;
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-paused {
      background: #374151;
      color: #E5E7EB;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .empty-state {
      text-align: center;
      padding: 24px 8px;
      color: #9CA3AF;
      font-size: 13px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #18181F;
      border: 1px solid #2B2B36;
      color: #FFFFFF;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #8B5CF6;
      background: #1F1F28;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 6px;
      accent-color: #7C3AED;
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      font-size: 12px;
      color: #E5E7EB;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .checkbox-label input {
      margin-top: 2px;
    }
    .form-message {
      display: none;
      background: #1F1F28;
      border: 1px solid #7C3AED;
      color: #F3F4F6;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .form-message.warn {
      border-color: #FBBF24;
      color: #FBBF24;
    }
    .form-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="view-list">
    <div class="header-bar">
      <h2>
        <span data-i18n="titleList">Monitored Pages</span>
        <span id="site-count-badge" class="counter-badge">(0/50)</span>
      </h2>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" type="button" aria-expanded="false" data-i18n-aria="titleSettings" data-i18n-title="titleSettings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
        <button id="btn-refresh-all" class="icon-btn" type="button" data-i18n-aria="btnRefreshAll" data-i18n-title="btnRefreshAll">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button id="btn-add-view" class="icon-btn primary" type="button" data-i18n-aria="btnAdd" data-i18n-title="btnAdd">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div id="settings-panel" class="settings-panel">
      <div class="settings-panel-inner">
        <div class="settings-box">
          <div class="settings-header">
            <span data-i18n="settingsTitle">Settings</span>
            <button id="btn-close-settings" class="icon-btn" type="button" data-i18n-aria="titleCloseSettings" data-i18n-title="titleCloseSettings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <div class="settings-grid">
            <div class="settings-col">
              <div class="settings-col-label" data-i18n="lblBackupCol">Settings backup</div>
              <div class="settings-col-actions">
                <button id="btn-backup" class="btn-secondary" type="button" data-i18n="btnBackup">Create</button>
                <button id="btn-restore" class="btn-secondary" type="button" data-i18n="btnRestore">Restore</button>
              </div>
            </div>
            <div class="settings-col">
              <div class="settings-col-label" data-i18n="lblLanguage">Language</div>
              <div class="lang-switcher" role="group" data-i18n-aria="lblLanguage">
                <button class="lang-btn" type="button" data-lang="en">EN</button>
                <button class="lang-btn" type="button" data-lang="pl">PL</button>
              </div>
            </div>
          </div>
          <input type="file" id="restore-file-input" accept=".json,application/json" style="display: none;">
        </div>
      </div>
    </div>

    <div id="sites-container"></div>
    <div class="list-footer">
      <div id="refresh-summary" class="refresh-summary" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="view-form" style="display: none;">
    <h2 id="form-title" data-i18n="titleAdd">Add Page</h2>
    <input type="hidden" id="site-id">
    
    <div class="form-group">
      <label data-i18n="lblSiteName">Name</label>
      <input type="text" id="site-name" maxlength="100" placeholder="e.g. News / Store">
    </div>
    
    <div class="form-group">
      <label data-i18n="lblSiteUrl">URL Address</label>
      <input type="text" id="site-url" placeholder="https://...">
      <div class="field-hint" data-i18n="hintJs">Only HTML sent by server is checked; JS-rendered content is not checked.</div>
    </div>

    <div class="form-group">
      <label data-i18n="lblOpenUrl">Opened page (optional)</label>
      <input type="text" id="site-openurl" placeholder="https://...">
      <div class="field-hint" data-i18n="hintOpenUrl">Opened when you click the card or notification.</div>
    </div>
    
    <div class="form-group">
      <label data-i18n="lblFreq">Check Frequency</label>
      <select id="site-freq">
        <option value="0" data-i18n="opt1m">Every 1 minute</option>
        <option value="1" data-i18n="opt5m">Every 5 minutes</option>
        <option value="2" data-i18n="opt10m">Every 10 minutes</option>
        <option value="3" data-i18n="opt1h">Every 1 hour</option>
        <option value="4" data-i18n="opt24h">Once a day</option>
      </select>
    </div>

    <label class="checkbox-label">
      <input type="checkbox" id="site-ignore-dates" checked>
      <span data-i18n="chkIgnoreDates">Ignore date and time changes</span>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="site-cookies">
      <div>
        <span data-i18n="chkCookies">Require cookies (logged-in sites)</span>
        <div class="field-hint" data-i18n="hintCookies">Use only if page requires active session/login.</div>
      </div>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="site-notifications" checked>
      <span data-i18n="chkNotifications">Enable desktop notifications</span>
    </label>

    <div id="form-message" class="form-message" role="alert"></div>

    <button id="btn-save" class="btn-main" data-i18n="btnSave">Save</button>
