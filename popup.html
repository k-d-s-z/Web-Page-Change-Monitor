<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html {
      overflow-x: hidden;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 12px;
      background-color: #09090E;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .counter-badge {
      font-size: 11px;
      color: #8B5CF6;
      font-weight: 600;
      margin-left: 4px;
    }
    #form-title {
      margin-bottom: 12px;
    }
    .lang-switcher {
      display: flex;
      gap: 2px;
      background: #121218;
      border: 1px solid #23232F;
      padding: 2px;
      border-radius: 16px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #9CA3AF;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      color: #FFFFFF;
    }
    .lang-btn.active {
      background: #8B5CF6;
      color: #FFFFFF;
    }
    .btn-main {
      width: 100%;
      padding: 8px 10px;
      background: #8B5CF6;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .btn-main:hover {
      background: #7C3AED;
    }
    .btn-main:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-main:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 2px;
    }
    .btn-cancel {
      background: #18181F;
      color: #9CA3AF;
      border: 1px solid #2B2B36;
    }
    .btn-cancel:hover {
      background: #23232F;
      color: #FFFFFF;
    }
    .list-footer {
      position: sticky;
      bottom: 0;
      z-index: 3;
      margin: 8px -12px -12px;
      padding: 8px 12px 12px;
      background: rgba(9, 9, 14, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .btn-main {
      flex: 1;
      width: auto;
      margin-bottom: 0;
    }
    .btn-sub-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-secondary {
      flex: 1;
      padding: 6px;
      background: #18181F;
      border: 1px solid #2B2B36;
      color: #E5E7EB;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      color: #FFFFFF;
      background: #23232F;
      border-color: #3B3B4A;
    }
    .btn-secondary:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .refresh-summary {
      font-size: 10px;
      color: #9CA3AF;
      margin-bottom: 6px;
    }
    .refresh-summary:empty {
      display: none;
    }
    .refresh-summary.ok {
      color: #A78BFA;
    }
    .refresh-summary.warn {
      color: #FBBF24;
    }
    .site-card {
      background: #18181F;
      border: 1px solid #2B2B36;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.2s ease;
    }
    .site-card:hover {
      border-color: #3B3B4A;
      background: #1F1F28;
    }
    .site-card:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .site-card.paused {
      opacity: 0.45;
      border-style: dashed;
    }
    .site-card.dragging {
      opacity: 1;
      border-color: #8B5CF6;
      transform: scale(1.01);
      position: relative;
      z-index: 2;
      background: #23232F;
    }
    body.is-dragging,
    body.is-dragging * {
      cursor: grabbing !important;
    }
    .site-card.confirming {
      border-color: #8B5CF6;
      background: #1F1F28;
    }
    .drag-handle {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 28px;
      margin: -2px 0 -2px -2px;
      padding: 0;
      background: #23232F;
      border: 1px solid #2B2B36;
      border-radius: 6px;
      color: #9CA3AF;
      cursor: grab;
      touch-action: none;
      transition: all 0.2s ease;
    }
    .drag-handle:hover {
      color: #FFFFFF;
      background: #2B2B36;
    }
    .drag-handle:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
      color: #FFFFFF;
    }
    .drag-handle svg {
      pointer-events: none;
      width: 10px;
      height: 10px;
    }
    .site-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .site-name {
      font-weight: 700;
      font-size: 13px;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .site-favicon {
      width: 13px;
      height: 13px;
      margin-right: 5px;
      vertical-align: -1px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .site-meta {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 1px;
      line-height: 1.2;
    }
    .meta-error {
      color: #F87171;
      text-decoration: underline;
      cursor: help;
    }
    .meta-flash.ok {
      color: #A78BFA;
    }
    .meta-flash.warn {
      color: #FBBF24;
    }
    .actions {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .btn-icon {
      background: #23232F;
      border: 1px solid #2B2B36;
      color: #9CA3AF;
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .btn-icon:hover {
      color: #FFFFFF;
      border-color: #3B3B4A;
      background: #2B2B36;
    }
    .btn-icon:focus-visible {
      outline: 2px solid #8B5CF6;
      outline-offset: 1px;
    }
    .btn-icon:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .btn-refresh.spinning .icon {
      display: inline-block;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-refresh.spinning .icon { animation-duration: 3s; }
    }
    .btn-toggle {
      color: #9CA3AF;
    }
    .btn-delete:hover {
      color: #F87171;
      border-color: rgba(248, 113, 113, 0.4);
      background: #2B2B36;
    }
    .confirm-text {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      font-weight: 500;
      color: #F3F4F6;
    }
    .confirm-name {
      font-size: 10px;
      font-weight: normal;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-confirm-yes, .btn-confirm-no {
      padding: 3px 8px;
      font-weight: 700;
      font-size: 10px;
      border-radius: 4px;
    }
    .btn-confirm-yes {
      background: #8B5CF6;
      border: none;
      color: #FFFFFF;
    }
    .btn-confirm-yes:hover {
      background: #7C3AED;
    }
    .hint, .field-hint {
      font-size: 11px;
      color: #6B7280;
      margin-top: 3px;
    }
    .hint { text-align: center; }
    .badge-changed {
      background: #8B5CF6;
      color: #FFFFFF;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #18181F;
      border: 1px solid #2B2B36;
      color: #FFFFFF;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #8B5CF6;
      background: #1F1F28;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 6px;
      accent-color: #8B5CF6;
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      font-size: 11px;
      color: #9CA3AF;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .checkbox-label input {
      margin-top: 2px;
    }
    .form-message {
      display: none;
      background: #1F1F28;
      border: 1px solid #8B5CF6;
      color: #F3F4F6;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 10px;
      margin-bottom: 10px;
    }
    .form-message.warn {
      border-color: #FBBF24;
      color: #FBBF24;
    }
    .form-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="view-list">
    <div class="header-bar">
      <h2>
        <span data-i18n="titleList">Monitored Pages</span>
        <span id="site-count-badge" class="counter-badge">(0/50)</span>
      </h2>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="pl">PL</button>
      </div>
    </div>
    <div id="sites-container"></div>
    <div class="list-footer">
      <div id="refresh-summary" class="refresh-summary" role="status" aria-live="polite"></div>
      <div class="btn-row">
        <button id="btn-refresh-all" class="btn-main" data-i18n="btnRefreshAll">Refresh all</button>
        <button id="btn-add-view" class="btn-main" data-i18n="btnAdd">+ Add New Page</button>
      </div>
      <div class="btn-sub-row">
        <button id="btn-backup" class="btn-secondary" data-i18n="btnBackup">Create Backup</button>
        <button id="btn-restore" class="btn-secondary" data-i18n="btnRestore">Restore Backup</button>
        <input type="file" id="restore-file-input" accept=".json,application/json" style="display: none;">
      </div>
    </div>
  </div>

  <div id="view-form" style="display: none;">
    <h2 id="form-title" data-i18n="titleAdd">Add Page</h2>
    <input type="hidden" id="site-id">
    
    <div class="form-group">
      <label data-i18n="lblSiteName">Name</label>
      <input type="text" id="site-name" maxlength="100" placeholder="e.g. News / Store">
    </div>
    
    <div class="form-group">
      <label data-i18n="lblSiteUrl">URL Address</label>
      <input type="text" id="site-url" placeholder="https://...">
      <div class="field-hint" data-i18n="hintJs">Only HTML sent by server is checked; JS-rendered content is not checked.</div>
    </div>
    
    <div class="form-group">
      <label data-i18n="lblFreq">Check Frequency</label>
      <select id="site-freq">
        <option value="0" data-i18n="opt1m">Every 1 minute</option>
        <option value="1" data-i18n="opt5m">Every 5 minutes</option>
        <option value="2" data-i18n="opt10m">Every 10 minutes</option>
        <option value="3" data-i18n="opt1h">Every 1 hour</option>
        <option value="4" data-i18n="opt24h">Once a day</option>
      </select>
    </div>

    <label class="checkbox-label">
      <input type="checkbox" id="site-ignore-dates" checked>
      <span data-i18n="chkIgnoreDates">Ignore date and time changes</span>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="site-cookies">
      <div>
        <span data-i18n="chkCookies">Require cookies (logged-in sites)</span>
        <div class="field-hint" data-i18n="hintCookies">Use only if page requires active session/login.</div>
      </div>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="site-notifications" checked>
      <span data-i18n="chkNotifications">Enable desktop notifications</span>
    </label>

    <div id="form-message" class="form-message" role="alert"></div>

    <button id="btn-save" class="btn-main" data-i18n="btnSave">Save</button>
    <button id="btn-cancel" class="btn-main btn-cancel" data-i18n="btnCancel">Cancel</button>
  </div>

  <script src="i18n.js"></script>
  <script src="storage.js"></script>
  <script src="cards.js"></script>
  <script src="drag.js"></script>
  <script src="popup.js"></script>
</body>
</html>
